services:
  app:
    build: .
    container_name: todo_app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/todo_db
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - backend-net

  db:
    image: postgres:15
    container_name: todo_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todo_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend-net

volumes:
  pgdata:

networks:
  backend-net:
    driver: bridge
